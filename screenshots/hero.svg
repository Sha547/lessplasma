<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#1a2330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#1a2330" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.04"/>
    </pattern>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- ─── Title ─── -->
  <g transform="translate(72, 96)" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-3">lessplasma</text>
    <text y="58" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.5">
      Minimal widgets for KDE Plasma 6.
    </text>
    <text y="98" font-size="14" font-weight="500" fill="#5AC8FA" letter-spacing="3">EIGHT WIDGETS · ONE AESTHETIC · ZERO BLOAT</text>
  </g>

  <!-- ─── Widget mockups (right side cluster) ─── -->
  <g transform="translate(720, 80)">

    <!-- Screen Time card (large, top-left) -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="240" height="200" rx="18" fill="#1c1c1e"/>
      <text x="20" y="40" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#fff">3h 1m</text>

      <!-- mini chart bars -->
      <g transform="translate(20, 70)">
        <rect x="0" y="40" width="3" height="12" rx="1" fill="#5AC8FA"/>
        <rect x="0" y="32" width="3" height="8" rx="1" fill="#FF9F0A"/>
        <rect x="14" y="20" width="3" height="32" rx="1" fill="#5AC8FA"/>
        <rect x="14" y="14" width="3" height="6" rx="1" fill="#FF9F0A"/>
        <rect x="28" y="48" width="3" height="4" rx="1" fill="#5AC8FA"/>
        <rect x="70" y="22" width="3" height="30" rx="1" fill="#5AC8FA"/>
        <rect x="84" y="18" width="3" height="34" rx="1" fill="#5AC8FA"/>
        <rect x="98" y="50" width="3" height="2" rx="1" fill="#34C759"/>
        <rect x="156" y="40" width="3" height="12" rx="1" fill="#FF9F0A"/>
        <rect x="170" y="35" width="3" height="17" rx="1" fill="#FF9F0A"/>
        <line x1="-2" y1="52" x2="200" y2="52" stroke="#fff" stroke-opacity="0.06"/>
      </g>

      <text x="20" y="148" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FF3B30">Browsing</text>
      <text x="20" y="166" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">1h 28m</text>

      <text x="92" y="148" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5AC8FA">Social</text>
      <text x="92" y="166" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">1h 15m</text>

      <text x="160" y="148" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FF9F0A">Creative</text>
      <text x="160" y="166" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">9m</text>
    </g>

    <!-- System Pulse pill -->
    <g transform="translate(260, 0)" filter="url(#card-shadow)">
      <rect width="240" height="60" rx="30" fill="#1c1c1e"/>
      <text x="22" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#fff" fill-opacity="0.55">CPU</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">23%</text>
      <rect x="22" y="36" width="50" height="4" rx="2" fill="#fff" fill-opacity="0.1"/>
      <rect x="22" y="36" width="12" height="4" rx="2" fill="#34C759"/>

      <text x="92" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#fff" fill-opacity="0.55">RAM</text>
      <text x="124" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">61%</text>
      <rect x="92" y="36" width="50" height="4" rx="2" fill="#fff" fill-opacity="0.1"/>
      <rect x="92" y="36" width="30" height="4" rx="2" fill="#FF9F0A"/>

      <text x="162" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#fff" fill-opacity="0.55">NET</text>
      <text x="194" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">128k</text>
      <rect x="162" y="36" width="50" height="4" rx="2" fill="#fff" fill-opacity="0.1"/>
      <rect x="162" y="36" width="6" height="4" rx="2" fill="#34C759"/>
    </g>

    <!-- Public IP pill -->
    <g transform="translate(260, 80)" filter="url(#card-shadow)">
      <rect width="240" height="60" rx="30" fill="#1c1c1e"/>
      <circle cx="22" cy="30" r="5" fill="#34C759"/>
      <text x="36" y="33" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#fff" fill-opacity="0.7">VPN</text>
      <line x1="74" y1="14" x2="74" y2="46" stroke="#fff" stroke-opacity="0.1"/>
      <text x="86" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">49.37.216.80</text>
      <text x="86" y="42" font-family="Inter, sans-serif" font-size="10" fill="#fff" fill-opacity="0.55">🇮🇳  Chennai, IN</text>
    </g>

    <!-- Bar Clock -->
    <g transform="translate(0, 220)" filter="url(#card-shadow)">
      <rect width="240" height="140" rx="18" fill="#1c1c1e"/>
      <text x="120" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#fff">14:23</text>

      <text x="20" y="70" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff" fill-opacity="0.55">H</text>
      <rect x="36" y="64" width="160" height="6" rx="3" fill="#fff" fill-opacity="0.08"/>
      <rect x="36" y="64" width="93" height="6" rx="3" fill="#FF9F0A"/>
      <text x="206" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">14</text>

      <text x="20" y="92" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff" fill-opacity="0.55">M</text>
      <rect x="36" y="86" width="160" height="6" rx="3" fill="#fff" fill-opacity="0.08"/>
      <rect x="36" y="86" width="61" height="6" rx="3" fill="#5AC8FA"/>
      <text x="206" y="92" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">23</text>

      <text x="20" y="114" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff" fill-opacity="0.55">S</text>
      <rect x="36" y="108" width="160" height="6" rx="3" fill="#fff" fill-opacity="0.08"/>
      <rect x="36" y="108" width="120" height="6" rx="3" fill="#34C759"/>
      <text x="206" y="114" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">45</text>
    </g>

    <!-- Sticky Note card -->
    <g transform="translate(260, 160)" filter="url(#card-shadow)">
      <rect width="240" height="200" rx="18" fill="#1c1c1e"/>
      <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.55">NOTE</text>
      <text x="20" y="68" font-family="Inter, sans-serif" font-size="13" fill="#fff">Pick up bread.</text>
      <text x="20" y="92" font-family="Inter, sans-serif" font-size="13" fill="#fff">Reply to Maya about</text>
      <text x="20" y="110" font-family="Inter, sans-serif" font-size="13" fill="#fff">the deck — by Tue.</text>
      <text x="20" y="146" font-family="Inter, sans-serif" font-size="13" fill="#fff" fill-opacity="0.5">Idea: rename screens</text>
      <text x="20" y="164" font-family="Inter, sans-serif" font-size="13" fill="#fff" fill-opacity="0.5">to "modes" everywhere?</text>
    </g>
  </g>

  <!-- ─── Footer dots ─── -->
  <g transform="translate(72, 540)">
    <text font-family="Inter, sans-serif" font-size="13" fill="#fff" fill-opacity="0.4">github.com/sha5/lessplasma</text>
  </g>
  <g transform="translate(72, 568)" font-family="Inter, sans-serif" font-size="11" fill="#fff" fill-opacity="0.3">
    <text>screen time · sticky note · system pulse · disk usage · calendar strip · wifi qr · public ip · bar clock</text>
  </g>
</svg>
